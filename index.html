
<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>Alinka KG</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(
        145deg, #130c22, #39204f, #170e27
      );
      color: white;
      text-align: center;
      padding: 30px 15px;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    h1 {
      font-size: 36px;
      color: #f4d58d;
      margin-bottom: 12px;
      letter-spacing: 2px;
    }

    .subtitle {
      font-size: 19px;
      color: #f9e5b6;
      margin-bottom: 25px;
    }

    .photo {
      display: block;
      border: 3px solid #d8ae61;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 10px 35px #0008;
    }

    .photo img {
      display: block;
      width: 100%;
      height: auto;
    }

    .button {
      display: block;
      margin-top: 25px;
      padding: 20px;
      background: linear-gradient(
        135deg, #f8e3a5, #c89943
      );
      border-radius: 16px;
      color: #21152d;
      font-size: 20px;
      font-weight: bold;
      text-decoration: none;
      box-shadow: 0 5px 20px #0006;
    }

    .button:hover {
      filter: brightness(1.1);
    }

    .footer {
      margin-top: 30px;
      color: #c9b9d5;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <div class="container">

    <h1>ALINKA KG</h1>

    <p class="subtitle">
      Кош келиңиздер!
    </p>

    <a class="photo"
       href="https://1wsvyz.com/?open=register&amp;p=vklc"
       target="_blank"
       rel="noopener noreferrer">
      <img src="photo.jpg"
           alt="Катталуу үчүн басыңыз">
    </a>

    <a class="button"
       href="https://1wsvyz.com/?open=register&amp;p=vklc"
       target="_blank"
       rel="noopener noreferrer">
      ✨ БУЛ ЖАККА БАСЫҢЫЗ — КАТТАЛЫҢЫЗ ✨
    </a>

    <p class="footer">
      © 2026 Alinka KG
    </p>

  </div>
</body>
</html>
